apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-admin-deployment
  labels:
    app: ms-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-admin
  template:
    metadata:
      labels:
        app: ms-admin
    spec:
      - containers:
        - name: ms-admin
          image: felipesalazar24/ms-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: RABBITMQ_HOST
              value: "IP_PRIVADA_DE_TU_EC2_O_SERVICIO"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-admin-service
spec:
  type: ClusterIP
  selector:
    app: ms-admin
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085